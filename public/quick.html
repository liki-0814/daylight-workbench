<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="/ui/theme-boot.js"></script>
    <meta name="color-scheme" content="light">
    <title>快捷问答与搜索 · Daylight</title>
    <link rel="stylesheet" href="/design-system.css">
    <link rel="stylesheet" href="/components/button.css">
    <link rel="stylesheet" href="/components/segmented-control.css">
    <link rel="stylesheet" href="/components/image-input.css">
    <link rel="stylesheet" href="/components/dialog-shell.css">
    <link rel="stylesheet" href="/ai.css">
    <link rel="stylesheet" href="/quick.css">
  </head>
  <body>
    <main id="quick" class="quick-shell">
      <form id="quick-form" class="quick-form">
        <span class="quick-glyph" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg></span>
        <input id="quick-input" class="quick-input" type="text" placeholder="问一个问题，关闭即清空" aria-label="临时问答" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="30000">
        <button id="quick-close" class="quick-close" type="button" aria-label="关闭快捷面板">esc</button>
      </form>
      <div id="quick-images" class="image-input quick-images" aria-label="已粘贴的图片" hidden></div>
      <section id="quick-result" class="quick-result" aria-label="AI 回答" hidden>
        <header class="quick-result-header"><span id="quick-model"></span><span id="quick-buttons"></span></header>
        <div id="quick-status" class="quick-status" role="status" aria-live="polite"></div>
        <div id="quick-answer" class="quick-answer ai-markdown" tabindex="0" aria-label="回答内容"></div>
      </section>
      <footer class="quick-footer">
        <span class="quick-action"><span class="keycap" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3v5a2 2 0 0 1-2 2H3m3-3-3 3 3 3"/></svg></span><span id="quick-action">用 Google 搜索</span></span>
        <span id="quick-mode"></span>
      </footer>
    </main>
    <script type="module" src="/quick.js"></script>
  </body>
</html>
